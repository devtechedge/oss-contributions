name: Sync merged OSS

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional PR to force-reconcile, owner/repo and number"
        required: false
        type: string
      summary:
        description: "Optional curated summary for a new publication record"
        required: false
        type: string
      dry_run:
        description: "Print the plan without writing"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [upstream-merged]

concurrency:
  group: sync-merged-oss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ledger
        uses: actions/checkout@v4

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          repository: devtechedge/${{ secrets.JOBSEARCH_REPO_NAME }}
          path: sources-a
          token: ${{ secrets.LEDGER_SYNC_TOKEN }}

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          repository: devtechedge/${{ secrets.OSS_OPS_REPO_NAME }}
          path: sources-b
          token: ${{ secrets.LEDGER_SYNC_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile and publish
        id: reconcile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEDGER_SYNC_TOKEN: ${{ secrets.LEDGER_SYNC_TOKEN }}
          INPUT_PR: ${{ github.event.inputs.pr || github.event.client_payload.pr || '' }}
          INPUT_SUMMARY: ${{ github.event.inputs.summary || github.event.client_payload.summary || '' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(--root . --ops-root sources-b --update-about --private-root sources-a)
          if [ -n "${INPUT_PR}" ]; then
            ARGS+=(--pr "${INPUT_PR}")
          fi
          if [ -n "${INPUT_SUMMARY}" ]; then
            ARGS+=(--summary "${INPUT_SUMMARY}")
          fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          node sources-b/scripts/sync-merged-oss.mjs "${ARGS[@]}" > /tmp/sync-report.json
          echo "new_merged=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/sync-report.json','utf8')).merged.length")" >> "$GITHUB_OUTPUT"
          echo "merged_count=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/sync-report.json','utf8')).merged_count")" >> "$GITHUB_OUTPUT"
          echo "repo_count=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/sync-report.json','utf8')).repo_count")" >> "$GITHUB_OUTPUT"

      - name: Patch documents
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          python sources-b/scripts/sync-docx-to-private.py --oss-root . --ops-root sources-b --private-root sources-a > /tmp/docx-sync.txt

      - name: Commit ledger if changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: node sources-b/scripts/commit-sync-tree.mjs ledger .

      - name: Commit source updates if changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: node sources-b/scripts/commit-sync-tree.mjs ops sources-b

      - name: Commit source updates if changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: node sources-b/scripts/commit-sync-tree.mjs career sources-a

      - name: Notify site on new merges
        if: ${{ steps.reconcile.outputs.new_merged != '0' && github.event.inputs.dry_run != 'true' }}
        env:
          LEDGER_SYNC_TOKEN: ${{ secrets.LEDGER_SYNC_TOKEN }}
          MERGED_COUNT: ${{ steps.reconcile.outputs.merged_count }}
          REPO_COUNT: ${{ steps.reconcile.outputs.repo_count }}
        run: |
          set -euo pipefail
          case "${MERGED_COUNT}" in
            ''|*[!0-9]*) echo "::error::merged count missing"; exit 1 ;;
          esac
          case "${REPO_COUNT}" in
            ''|*[!0-9]*) echo "::error::repo count missing"; exit 1 ;;
          esac
          payload="$(node -e 'const [merged, repos] = process.argv.slice(1); process.stdout.write(JSON.stringify({event_type:"oss-stats-refresh", client_payload:{merged_count:Number(merged), repo_count:Number(repos)}}))' "${MERGED_COUNT}" "${REPO_COUNT}")"
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${LEDGER_SYNC_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/devtechedge/devtechedge.github.io/dispatches \
            -d "${payload}"
